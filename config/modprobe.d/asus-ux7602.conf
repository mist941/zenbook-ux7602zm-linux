# Options of the asus_ux7602 module (see: modinfo asus_ux7602)
#   kbd_brightness     keyboard backlight level at boot, 0-3 (-1 = leave as is)
#   kbd_color          keyboard colour at boot, RRGGBB
#   kbd_own_led        1 = register asus::kbd_backlight in this module instead of
#                      through asus-wmi (always the case on kernels before 7.0)
#   camera_boot_state  1 = camera available at boot, 0 = blocked, -1 = leave as is
#   dial_mode          volume | brightness | scroll | zoom | media | raw
#   dial_pressed_mode  action while the dial is held down
#   dial_press_cycles  1 = a click cycles volume/brightness/scroll
options asus_ux7602 kbd_brightness=2 camera_boot_state=1 dial_mode=volume dial_pressed_mode=brightness
