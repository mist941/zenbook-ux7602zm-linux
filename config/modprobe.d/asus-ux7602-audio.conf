# ASUS Zenbook UX7602ZM speakers: ALC285 + two CS35L41 amps (PCI SSID 1043:1f62).
#
# The in-kernel quirk for 1043:1f62 (ALC245_FIXUP_CS35L41_SPI_2) leaves the
# "Bass Speaker" pin 0x17 on DAC 0x06, which has no volume control, so the
# volume slider only changes the tweeters. "1043:1caf" makes the codec driver
# use the quirk chain of that SSID instead:
#   ALC285_FIXUP_ASUS_SPI_REAR_SPEAKERS -> ASUS_HEADSET_MIC
#   -> ASUS_SPEAKER2_TO_DAC1 (pin 0x17 -> DAC 0x02) -> CS35L41_SPI_2
# which is what the pending upstream patch for this model does. The CS35L41
# amp configuration still comes from ACPI _SUB 10431F62, so it is unaffected.
#
# Alternative with fewer pin overrides (no 0x14 override): hda_model=1043:1c9f
#
# SOF (Intel Smart Sound, used because of the digital microphones):
options snd_sof_intel_hda_generic hda_model=1043:1caf
# kernels before ~6.10 had the parameter in this module:
options snd_sof_intel_hda_common hda_model=1043:1caf
# legacy HDA driver (only used with snd_intel_dspcfg.dsp_driver=1):
options snd_hda_intel model=1043:1caf
