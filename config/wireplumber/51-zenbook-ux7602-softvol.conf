# FALLBACK ONLY - not needed with the hda_model option from
# /etc/modprobe.d/asus-ux7602-audio.conf.
#
# Without that option the "Bass Speaker" pair (pin 0x17, DAC 0x06) has no
# hardware volume and always plays at full level. Software volume scales both
# speaker pairs together; the hardware "Speaker" control must then stay at
# 100%:  amixer -c sofhdadsp sset Speaker 100% unmute
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.pci-0000_00_1f.3.*" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
