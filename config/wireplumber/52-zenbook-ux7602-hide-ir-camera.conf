# The webcam module (USB 13D3:5280) also exposes its Windows Hello infrared
# sensor as a second camera. Apps that pick it get a dark, greyscale picture,
# so hide it from PipeWire. Howdy and other tools that open /dev/video* directly
# still see it.
monitor.v4l2.rules = [
  {
    matches = [
      { api.v4l2.cap.card = "~.*IR UVC WebCam.*" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
